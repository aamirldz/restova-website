<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="pos.css">
  <style>
    body { margin: 0; padding: 0; background: var(--bg); overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
    ::-webkit-scrollbar { display: none; }
    .captain-phone { width: 320px; height: 600px; background: #fff; border-radius: 36px; box-shadow: 0 20px 40px rgba(0,0,0,.2); overflow: hidden; display: flex; flex-direction: column; border: 8px solid #111; position: relative; }
    .captain-notch { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 120px; height: 20px; background: #111; border-bottom-left-radius: 12px; border-bottom-right-radius: 12px; z-index: 10; }
    
    .topbar { padding: 30px 16px 10px; background: #fff; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .screen-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    
    /* Captain tables mini */
    .table-mini-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 12px; border-bottom: 1px solid var(--border); background: #f9fafb; }
    .table-mini { aspect-ratio: 1; border-radius: var(--r); border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: .8rem; font-weight: 700; background: #fff; color: var(--text); }
    .table-mini.occupied { background: rgba(254, 243, 199, .6); border-color: rgba(253, 230, 138, .6); color: #92400e; }
    .table-mini.selected { border-color: var(--brand); box-shadow: 0 0 0 2px rgba(230,57,70,.2); background: rgba(230,57,70,.05); color: var(--brand); }
    .table-mini-status { font-size: .45rem; text-transform: uppercase; margin-top: 2px; }
    
    /* Captain menu area */
    .menu-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .cat-tabs { display: flex; gap: 6px; padding: 12px; overflow-x: auto; background: #fff; border-bottom: 1px solid var(--border); }
    .cat-tab { padding: 6px 12px; border-radius: 20px; font-size: .7rem; font-weight: 600; border: 1px solid var(--glass-border); white-space: nowrap; }
    .cat-tab.active { background: var(--brand); color: #fff; border-color: var(--brand); }
    
    .menu-items { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; background: var(--bg); }
    .menu-item { background: #fff; border-radius: var(--r); padding: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); }
    .menu-item-info { display: flex; align-items: center; gap: 8px; }
    .veg-icon { width: 12px; height: 12px; border: 1.5px solid; border-radius: 2px; display: flex; align-items: center; justify-content: center; }
    .veg-icon::after { content: ''; width: 6px; height: 6px; border-radius: 50%; }
    .veg-icon.nonveg { border-color: var(--err); }
    .veg-icon.nonveg::after { background: var(--err); }
    .veg-icon.veg { border-color: var(--ok); }
    .veg-icon.veg::after { background: var(--ok); }
    .menu-item-name { font-weight: 600; font-size: .8rem; }
    .menu-item-price { font-size: .7rem; color: var(--text-m); }
    .add-btn { width: 28px; height: 28px; border-radius: 50%; background: rgba(230,57,70,.1); color: var(--brand); font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 1rem; }
    
    .bottom-bar { padding: 12px; background: #fff; border-top: 1px solid var(--border); }
    .send-btn { width: 100%; padding: 12px; background: var(--grad); color: #fff; border-radius: var(--r); font-weight: 700; font-size: .9rem; border: none; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: var(--grad-glow); }
    .cart-badge { background: rgba(255,255,255,.2); padding: 2px 8px; border-radius: 10px; font-size: .7rem; }
  </style>
</head>
<body>
  <div class="captain-phone">
    <div class="captain-notch"></div>
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:8px">
        <div style="width:24px;height:24px;background:var(--grad);border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:.7rem">R</div>
        <span style="font-weight:700;font-size:1rem">Captain</span>
      </div>
      <div style="font-size:.7rem;font-weight:700;color:var(--info);background:rgba(37,99,235,.1);padding:4px 10px;border-radius:6px">Table 5</div>
    </header>
    
    <div class="screen-content">
      <div class="table-mini-grid">
        <div class="table-mini">T1<div class="table-mini-status">Open</div></div>
        <div class="table-mini occupied">T2<div class="table-mini-status">Occupied</div></div>
        <div class="table-mini">T3<div class="table-mini-status">Open</div></div>
        <div class="table-mini occupied">T4<div class="table-mini-status">Occupied</div></div>
        <div class="table-mini selected">T5<div class="table-mini-status">Selected</div></div>
        <div class="table-mini">T6<div class="table-mini-status">Open</div></div>
        <div class="table-mini">T7<div class="table-mini-status">Open</div></div>
        <div class="table-mini">T8<div class="table-mini-status">Open</div></div>
      </div>
      
      <div class="menu-area">
        <div class="cat-tabs">
          <div class="cat-tab active">Main Course</div>
          <div class="cat-tab">Starters</div>
          <div class="cat-tab">Breads</div>
          <div class="cat-tab">Drinks</div>
        </div>
        
        <div class="menu-items">
          <div class="menu-item">
            <div class="menu-item-info">
              <div class="veg-icon nonveg"></div>
              <div>
                <div class="menu-item-name">Butter Chicken</div>
                <div class="menu-item-price">₹450</div>
              </div>
            </div>
            <div class="add-btn">+</div>
          </div>
          <div class="menu-item">
            <div class="menu-item-info">
              <div class="veg-icon veg"></div>
              <div>
                <div class="menu-item-name">Dal Makhani</div>
                <div class="menu-item-price">₹250</div>
              </div>
            </div>
            <div class="add-btn">+</div>
          </div>
          <div class="menu-item">
            <div class="menu-item-info">
              <div class="veg-icon nonveg"></div>
              <div>
                <div class="menu-item-name">Chicken 65</div>
                <div class="menu-item-price">₹320</div>
              </div>
            </div>
            <div class="add-btn">+</div>
          </div>
          <div class="menu-item">
            <div class="menu-item-info">
              <div class="veg-icon veg"></div>
              <div>
                <div class="menu-item-name">Paneer Tikka</div>
                <div class="menu-item-price">₹350</div>
              </div>
            </div>
            <div class="add-btn">+</div>
          </div>
        </div>
        
        <div class="bottom-bar">
          <button class="send-btn">
            Send to Kitchen <span class="cart-badge">4 items</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
