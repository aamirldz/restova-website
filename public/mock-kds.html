<!DOCTYPE html>
<html>
<head>
    <meta name="robots" content="noindex, nofollow, noarchive">
  <meta charset="utf-8">
  <link rel="stylesheet" href="pos.css">
  <style>
    body { margin: 0; padding: 0; background: var(--bg); overflow: hidden; }
    ::-webkit-scrollbar { display: none; }
    #app { display: flex; flex-direction: column; height: 100vh; padding: 0; }
    .kds-header { padding: 12px 16px; background: #fff; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .kds-grid { padding: 16px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; overflow-y: auto; flex: 1; }
  </style>
</head>
<body>
  <div id="app">
    <div class="kds-header">
      <div style="font-weight:700;font-size:1.1rem;display:flex;align-items:center;gap:8px">
        <div style="width:28px;height:28px;background:var(--grad);border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff">R</div>
        Restova KDS
      </div>
      <div class="kds-station-tabs">
          <button class="kds-station-btn active">All Stations</button>
          <button class="kds-station-btn">Hot Kitchen</button>
          <button class="kds-station-btn">Tandoor</button>
      </div>
      <div class="kds-stats">
          <div class="kds-stat"><strong>6</strong> Active</div>
          <div class="kds-stat ready"><strong>2</strong> Ready</div>
      </div>
    </div>
    <div class="kds-grid">
      <!-- KOT Card 1 - New -->
      <div class="kds-card new" style="height: fit-content;">
          <div class="kds-card-head">
            <div>
              <span class="kds-id">KOT-14</span>
              <span class="kds-type-badge dine-in">DINE IN</span>
              <span class="kds-table-badge">T5</span>
            </div>
            <span class="kds-timer">2:15</span>
          </div>
          <div class="kds-progress"><div class="kds-progress-fill" style="width:15%"></div></div>
          <div class="kds-items-list">
            <div class="kds-item">
              <button class="kds-item-check">○</button>
              <span class="kds-item-name">Butter Chicken</span>
              <span class="kds-item-qty">×1</span>
            </div>
            <div class="kds-item">
              <button class="kds-item-check">○</button>
              <span class="kds-item-name">Dal Makhani</span>
              <span class="kds-item-qty">×1</span>
            </div>
            <div class="kds-item">
              <button class="kds-item-check">○</button>
              <span class="kds-item-name">Garlic Naan</span>
              <span class="kds-item-qty">×3</span>
            </div>
          </div>
          <div class="kds-card-actions" style="display:flex;gap:8px;margin-top:12px">
            <button style="flex:1;padding:8px;border-radius:6px;border:none;background:var(--grad);color:#fff;font-weight:700">▶ Start Cooking</button>
          </div>
      </div>
      <!-- KOT Card 2 - Cooking -->
      <div class="kds-card" style="height: fit-content;">
          <div class="kds-card-head">
            <div>
              <span class="kds-id">KOT-13</span>
              <span class="kds-type-badge dine-in">DINE IN</span>
              <span class="kds-table-badge">T2</span>
            </div>
            <span class="kds-timer warning">8:42</span>
          </div>
          <div class="kds-progress"><div class="kds-progress-fill" style="width:55%"></div></div>
          <div class="kds-items-list">
            <div class="kds-item done">
              <button class="kds-item-check">✓</button>
              <span class="kds-item-name">Paneer Tikka</span>
              <span class="kds-item-qty">×2</span>
            </div>
            <div class="kds-item">
              <button class="kds-item-check">○</button>
              <span class="kds-item-name">Tandoori Roti</span>
              <span class="kds-item-qty">×4</span>
            </div>
          </div>
          <div class="kds-card-actions" style="display:flex;gap:8px;margin-top:12px">
            <button style="flex:1;padding:8px;border-radius:6px;border:none;background:var(--ok);color:#fff;font-weight:700">✓ Bump Ready</button>
          </div>
      </div>
      <!-- KOT Card 3 - Ready -->
      <div class="kds-card ready" style="height: fit-content;">
          <div class="kds-card-head">
            <div>
              <span class="kds-id">KOT-12</span>
              <span class="kds-type-badge takeaway">TAKEAWAY</span>
            </div>
            <span class="kds-timer">14:20</span>
          </div>
          <div class="kds-progress"><div class="kds-progress-fill" style="width:100%"></div></div>
          <div class="kds-items-list">
            <div class="kds-item done">
              <button class="kds-item-check">✓</button>
              <span class="kds-item-name">Chicken 65</span>
              <span class="kds-item-qty">×1</span>
            </div>
            <div class="kds-item done">
              <button class="kds-item-check">✓</button>
              <span class="kds-item-name">Garlic Naan</span>
              <span class="kds-item-qty">×3</span>
            </div>
          </div>
          <div class="kds-card-actions" style="display:flex;gap:8px;margin-top:12px">
            <button style="flex:1;padding:8px;border-radius:6px;border:none;background:#22c55e;color:#fff;font-weight:700;animation:pulse 1.5s infinite">✓ Complete Order</button>
          </div>
      </div>
      <!-- KOT Card 4 - Urgent -->
      <div class="kds-card urgent" style="height: fit-content;">
          <div class="kds-card-head">
            <div>
              <span class="kds-id">KOT-11</span>
              <span class="kds-type-badge dine-in">DINE IN</span>
              <span class="kds-table-badge">T7</span>
            </div>
            <span class="kds-timer urgent">18:05</span>
          </div>
          <div class="kds-progress"><div class="kds-progress-fill" style="width:80%;background:var(--err)"></div></div>
          <div class="kds-items-list">
            <div class="kds-item done">
              <button class="kds-item-check">✓</button>
              <span class="kds-item-name">Veg Biryani</span>
              <span class="kds-item-qty">×2</span>
            </div>
            <div class="kds-item">
              <button class="kds-item-check">○</button>
              <span class="kds-item-name">Raita</span>
              <span class="kds-item-qty">×2</span>
            </div>
          </div>
          <div class="kds-card-actions" style="display:flex;gap:8px;margin-top:12px">
            <button style="flex:1;padding:8px;border-radius:6px;border:none;background:var(--ok);color:#fff;font-weight:700">✓ Bump Ready</button>
          </div>
      </div>
    </div>
  </div>
</body>
</html>
